seed: 42
deterministic: true
device: auto
cpu_threads: 1
batch_size: 4
num_workers: 4
pin_memory: true
max_question_length: 40
max_answer_length: 10
epochs: 5
learning_rate: 0.0002
weight_decay: 0.01
scheduler: linear
warmup_steps: 200
warmup_ratio: null
max_grad_norm: 1.0
checkpoint_monitor: val/answerability_ap
checkpoint_mode: max
early_stopping_patience: 3
progress:
  enabled: true
  leave: false
  update_every_n_steps: 1
output_dir: ${hydra:runtime.output_dir}/checkpoint
