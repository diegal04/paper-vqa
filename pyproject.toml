[project]
name = "paper-vqa"
version = "0.1.0"
description = "Reproducible selective Visual Question Answering experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.0",
    "hydra-core>=1.3.2",
    "numpy>=2.0",
    "omegaconf>=2.3",
    "pillow>=10.4",
    "peft>=0.14",
    "safetensors>=0.5",
    "scikit-learn>=1.5",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "tqdm>=4.67",
    "transformers>=4.48",
    "wandb>=0.19",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-tqdm>=4.67",
]

[project.scripts]
paper-vqa-train = "paper_vqa.cli.train:main"
paper-vqa-evaluate = "paper_vqa.cli.evaluate:main"
paper-vqa-prepare-data = "paper_vqa.cli.prepare_data:main"
paper-vqa-audit-data = "paper_vqa.cli.audit_data:main"
paper-vqa-baseline = "paper_vqa.cli.baseline:main"
paper-vqa-evaluate-development = "paper_vqa.cli.evaluate_development:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_vqa"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "paper_vqa/configs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213", "D413"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["datasets.*", "hydra.*", "omegaconf.*", "peft.*", "safetensors.*", "sklearn.*", "transformers.*", "wandb.*"]
ignore_missing_imports = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
